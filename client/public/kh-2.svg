<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
  </defs>

  <g id="shield-mark" transform="translate(15, 10)">
    <!-- Outer Shield Container -->
    <path d="M 50 8 L 85 24 V 56 C 85 76 50 94 50 94 C 50 94 15 76 15 56 V 24 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Code Terminal Prompt Overlay (>_) -->
    <path d="M 36 38 L 48 50 L 36 62" fill="none" stroke="url(#shield-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="56" y1="62" x2="68" y2="62" stroke="#00B4D8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g id="brand-name" transform="translate(125, 70)">
    <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="46" fill="#0B132B" letter-spacing="-1">Kodas</text>
    <text x="142" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="46" fill="#0052D4" letter-spacing="-1">Hub</text>
  </g>
</svg>
