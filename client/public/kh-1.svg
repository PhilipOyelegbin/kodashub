<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Royal Blue to Electric Cyan -->
    <linearGradient id="kh-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    
    <!-- Subtle Inner Glow Gradient -->
    <linearGradient id="kh-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0052D4" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <g id="logo-mark" transform="translate(10, 10)">
    <!-- Outer Hexagonal Frame Boundary -->
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#kh-gradient)" stroke-width="4" stroke-linejoin="round" opacity="0.15" />

    <!-- Interlocking Connection Lines (Forming 'K') -->
    <!-- Vertical Spine -->
    <path d="M 28 22 L 28 78" stroke="url(#kh-gradient)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Top Diagonal Connection Branch -->
    <path d="M 28 50 L 62 24" stroke="url(#kh-gradient)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Bottom Diagonal Connection Branch -->
    <path d="M 28 50 L 62 76" stroke="url(#kh-gradient)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Horizontal Server Mesh Link -->
    <path d="M 42 39 L 74 39" stroke="url(#kh-gradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 42 61 L 74 61" stroke="url(#kh-gradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Terminal Connection Nodes -->
    <circle cx="28" cy="22" r="6" fill="#0052D4" />
    <circle cx="28" cy="78" r="6" fill="#0052D4" />
    <circle cx="62" cy="24" r="6" fill="#00B4D8" />
    <circle cx="62" cy="76" r="6" fill="#0052D4" />
    <circle cx="74" cy="39" r="5" fill="#00B4D8" />
    <circle cx="74" cy="61" r="5" fill="#00B4D8" />
    <circle cx="28" cy="50" r="7" fill="#0052D4" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography -->
  <g id="logo-text" transform="translate(125, 70)">
    <!-- "Kodas" in Deep Navy -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="46" fill="#0B132B" letter-spacing="-1">Kodas</text>
    <!-- "Hub" in Electric Cyan -->
    <text x="142" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="46" fill="#00B4D8" letter-spacing="-1">Hub</text>
    <!-- Tech Badge Dot -->
    <circle cx="238" cy="-32" r="5" fill="#10B981" />
  </g>
</svg>
